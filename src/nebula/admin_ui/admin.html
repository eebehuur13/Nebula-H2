<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nebula Admin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1' y='1' width='22' height='22' rx='6' fill='%23101828'/%3E%3Ccircle cx='12' cy='12' r='4.2' fill='none' stroke='white' stroke-width='1.8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/assets/admin.css?v=5">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-overview" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.2 4.4 1.9 5 4.9"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
    <symbol id="i-indexing" viewBox="0 0 24 24"><path d="M12 3 3 7.5 12 12l9-4.5L12 3Z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/></symbol>
    <symbol id="i-sources" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></symbol>
    <symbol id="i-jobs" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="18" r="1.2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></symbol>
    <symbol id="i-numbers" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 4v16"/></symbol>
    <symbol id="i-signin" viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M10 16l4-4-4-4M14 12H3"/></symbol>
    <symbol id="i-admin" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.2 7.5 9.5 4.3-1.3 7.5-4.9 7.5-9.5V6L12 3Z"/></symbol>
    <symbol id="i-other" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.5L3 9"/><path d="M3 4v5h5"/><path d="M4 13a8 8 0 0 0 14.6 4.5L21 15"/><path d="M21 20v-5h-5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5v14l11-7L7 5Z"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v4.5M12 17.5v.01"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-drive" viewBox="0 0 24 24"><path d="M8.5 3.5h7l6 10.5-3.5 6h-12L2.5 14l6-10.5Z"/><path d="M2.5 14h19"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M3 15h18M10 9.5V20"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  </defs>
</svg>

<header class="top">
  <div class="bar">
    <a class="brand" href="/admin" aria-label="Nebula admin">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6"/><circle cx="12" cy="12" r="4.2"/><path d="M4.5 15.5c3.5-1.6 11.5-5.4 15-7"/></svg>
      <span class="wordmark">Nebula</span>
      <span class="slash" aria-hidden="true">/</span>
      <span class="area">Admin</span>
    </a>
    <div class="status">
      <span class="pill" id="worker-pill" title="The background worker that reads files and runs jobs"><i></i><span>Worker</span></span>
      <span class="pill" id="live-pill" title="This page refreshes itself every few seconds"><i></i><span>Live</span></span>
      <div class="clock" title="India Standard Time">
        <span class="clock-time" id="clock-time">--:--:--</span>
        <span class="clock-date" id="clock-date">IST</span>
      </div>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="overview">Overview</button>
    <button role="tab" data-tab="people">People<i class="tab-count" id="count-people" hidden></i></button>
    <button role="tab" data-tab="activity">Activity</button>
    <button role="tab" data-tab="indexing">Indexing<i class="tab-count" id="badge-indexing" hidden></i></button>
    <button role="tab" data-tab="sources">Sources</button>
    <button role="tab" data-tab="jobs">Jobs<i class="tab-count" id="badge-jobs" hidden></i></button>
    <span class="tab-ink" aria-hidden="true"></span>
  </nav>
</header>

<main class="page">
  <div class="page-head">
    <div class="titles">
      <h1 id="page-title">Overview</h1>
      <p id="page-sub">Everything happening in Nebula, live.</p>
    </div>
    <div class="range" id="range" role="radiogroup" aria-label="Time range">
      <button data-range="1h">Last hour</button>
      <button data-range="today">Today</button>
      <button data-range="24h">24 hours</button>
      <button data-range="7d">7 days</button>
      <button data-range="all">All time</button>
      <span class="range-ink" aria-hidden="true"></span>
    </div>
  </div>

  <section class="view" id="view-overview" data-view="overview"></section>
  <section class="view" id="view-people" data-view="people"></section>
  <section class="view" id="view-activity" data-view="activity"></section>
  <section class="view" id="view-indexing" data-view="indexing"></section>
  <section class="view" id="view-sources" data-view="sources"></section>
  <section class="view" id="view-jobs" data-view="jobs"></section>

  <footer class="foot">
    <span id="foot-me"></span>
    <span class="dot-sep"></span>
    <span id="foot-updated">Waiting for the first update…</span>
    <span class="dot-sep"></span>
    <a href="/web">Browse Nebula</a>
    <span class="dot-sep"></span>
    <a href="/logout">Sign out</a>
  </footer>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-scrim" data-close></div>
  <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <button class="icon-btn drawer-close" data-close aria-label="Close"><svg><use href="#i-x"/></svg></button>
    <div id="drawer-body"></div>
  </div>
</aside>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/admin/assets/admin.js?v=4"></script>
</body>
</html>
